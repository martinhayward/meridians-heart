<main>

<div class="page">
  <h1 class="reveal">Contact</h1>

  <form class="contact-form" action="mailto:maschr623@aol.com" method="post" enctype="text/plain">
    <div class="form-row">
      <div>
        <label for="first-name">First Name</label>
        <input id="first-name" name="First Name" type="text" required>
      </div>
      <div>
        <label for="last-name">Last Name</label>
        <input id="last-name" name="Last Name" type="text" required>
      </div>
    </div>
    <div>
      <label for="email">Email Address</label>
      <input id="email" name="Email" type="email" required>
    </div>
    <div>
      <label for="subject">Subject</label>
      <input id="subject" name="Subject" type="text" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="Message" rows="6" required></textarea>
    </div>
    <button class="submit-btn" type="submit">Submit</button>
  </form>

  <p class="note reveal" style="margin-top:1rem;">This form opens your email client to send the message directly.</p>
</div>
